name: Tubayo Hotel Scraper

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Create output folder
        run: mkdir -p output

      - name: Run scraper
        run: python tubayo_scraper.py

      - name: Move output files
        run: |
          mv tubayo_hotels_*.csv output/ 2>/dev/null || true
          mv tubayo_hotels_*.json output/ 2>/dev/null || true
          mv scraper_report_*.txt output/ 2>/dev/null || true

      - name: Commit and push results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --staged --quiet || git commit -m "Auto scrape $(date +'%Y-%m-%d')"
          git push